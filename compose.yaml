services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: copilot
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U copilot -d copilot']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - copilot-postgres:/var/lib/postgresql/data

  localstack:
    # v4.14.0 is the final pre-authentication Community release. Newer calendar-
    # versioned images require a LocalStack account token even for local SQS.
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - '4566:4566'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - './infra/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro'

volumes:
  copilot-postgres:
