name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check

  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: copilot
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot -d copilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose file
        env:
          IMAGE: example.invalid/voice-ai-observability:ci
          AWS_REGION: us-east-1
          LOG_GROUP_NAME: /voice-ai-observability/application
          API_ENV_FILE: .env.example
          INGESTION_ENV_FILE: .env.example
          ANALYSIS_ENV_FILE: .env.example
        run: docker compose --file compose.production.yaml config --quiet
      - run: docker build --tag voice-ai-observability:ci .
      - name: Verify production runtime
        run: |
          test "$(docker image inspect voice-ai-observability:ci --format '{{.Config.User}}')" = node
          docker run --rm --network host \
            --env DATABASE_URL=postgresql://copilot:copilot@127.0.0.1:5432/copilot \
            voice-ai-observability:ci \
            node apps/api/dist/database/migrate.js
